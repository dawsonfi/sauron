[package]
name = "cw-sauron"
version = "1.0.5"
edition = "2021"
description = "Cloudwatch CLI Tool"
license = "MIT"
repository = "https://github.com/dawsonfi/sauron"

[dependencies]
aws-config = "1.5.11"
aws-sdk-cloudwatchlogs = "1.62.0"
aws-smithy-types = "1.2.10"
aws-smithy-http = "0.60.11"
tokio = { version = "1.43.0", features = ["full"] }
chrono = "0.4.39"
mockall_double = "0.3.1"
mockall = "0.13.1"
derive_builder = "0.20.2"
clap = { version = "4.5.26", features = ["cargo", "derive"] }
async-trait = "0.1.85"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["registry", "env-filter"] }
tracing-bunyan-formatter = "0.3.10"
tracing-log = "0.2.0"
dialoguer = "0.11.0"
indicatif = "0.17.9"
console = "0.15.10"

[features]
integration=[]